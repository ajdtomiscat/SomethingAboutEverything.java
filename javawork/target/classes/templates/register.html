
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 二手交易平台</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        .top-bar {
            background: rgba(255,255,255,0.1);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .top-bar h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin: 0;
        }
        
        .top-bar a {
            color: white;
            text-decoration: none;
        }
        
        .register-container { margin-top: 60px; }
        .register-box { padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .title { text-align: center; margin-bottom: 30px; }
        .title h2 { color: #667eea; font-size: 28px; margin-bottom: 10px; }
        
        @media screen and (max-width: 768px) {
            .register-container { margin-top: 30px; }
            .register-box { padding: 25px; margin: 0 15px; }
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="top-bar">
        <div class="layui-container">
            <h1><a href="/">🏪 二手集市</a></h1>
        </div>
    </div>
    
    <div class="layui-container register-container">
        <div class="layui-row">
            <div class="layui-col-md4 layui-col-md-offset4">
                <div class="register-box">
                    <div class="title">
                        <h2>加入我们</h2>
                        <p style="color: #888;">创建新账户</p>
                    </div>
                    
                    <form class="layui-form" action="/register" method="post">
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-block">
                                <input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" class="layui-input">
                            </div>
                        </div>
                        
                        <div class="layui-form-item">
                            <label class="layui-form-label">密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="password" required lay-verify="required" placeholder="请输入密码" class="layui-input">
                            </div>
                        </div>
                        
                        <div class="layui-form-item">
                            <label class="layui-form-label">昵称</label>
                            <div class="layui-input-block">
                                <input type="text" name="nickname" required lay-verify="required" placeholder="请输入昵称" class="layui-input">
                            </div>
                        </div>
                        
                        <div class="layui-form-item">
                            <label class="layui-form-label">手机号</label>
                            <div class="layui-input-block">
                                <input type="text" name="phone" placeholder="请输入手机号（选填）" class="layui-input">
                            </div>
                        </div>
                        
                        <div th:if="${error}" class="layui-form-item">
                            <p style="color: #ff5722; text-align: center; padding: 10px; background: #fff5f5; border-radius: 4px;">[[${error}]]</p>
                        </div>
                        
                        <div class="layui-form-item">
                            <button class="layui-btn layui-btn-lg layui-btn-fluid" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" lay-submit lay-filter="register">注 册</button>
                        </div>
                        
                        <div style="text-align: center; margin-top: 20px;">
                            <a href="/login" style="color: #667eea;">已有账户？立即登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/layui/2.8.18/layui.js"></script>
</body>
</html>
